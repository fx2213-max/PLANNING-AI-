extra_instructions = """
The database contains housing maintenance complaints reported to NYC HPD in Queens.

Use only the tables and columns described in the data dictionary.

The housing_complaints table contains individual housing problem records.
One complaint may include multiple problems, so use COUNT(DISTINCT complaint_id) when counting unique complaints.

The housing_building_summary table contains building-level statistics.
The housing_daily_trend table contains daily counts by problem category.
The housing_top_buildings table contains the 20 buildings with the most reported problems in the current dataset.

Building IDs are stored as identifiers and should not be treated as numeric measurements.

The data represents a limited recent sample, not all housing complaints in Queens.
Do not describe the results as complete citywide or historical statistics.

A reported problem does not necessarily mean a confirmed housing violation.
Higher complaint counts do not necessarily indicate worse building quality.

When the user asks about information not available in the database, explain the limitation instead of guessing.

